[package]
name = "roc_desk_sql_standalone"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
roc_desk_sql = { path = "../lib" }
roc_desk_core = { git = "https://github.com/swimhigh/roc_desk-common", package = "roc_desk_core", tag = "common-v0.10.0" }
tauri = { version = "2", features = ["wry"] }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
